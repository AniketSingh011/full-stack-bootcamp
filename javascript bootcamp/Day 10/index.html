<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 10 - DOM Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🚀 JavaScript Bootcamp - Day 10</h1>

    <h2 id="count">0</h2>

    <button id="increase">+</button>
    <button id="decrease">-</button>
    <button id="reset">Reset</button>

    <hr>

    <button id="toggleBtn">Toggle Dark Mode</button>

    <hr>

    <button id="colorBtn">Random Background Color</button>

    <hr>

    <textarea id="text" rows="5" cols="40" placeholder="Type here..."></textarea>

    <p>Characters: <span id="charCount">0</span></p>

    <hr>

    <h2 id="quote">Click below for a motivational quote!</h2>

    <button id="quoteBtn">New Quote</button>

    <script src="script.js"></script>

</body>
